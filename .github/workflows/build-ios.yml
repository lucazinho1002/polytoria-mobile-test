name: Compilar Godot Mono IPA (TrollStore / LiveContainer)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 1. Instalar o .NET SDK necessário para o Godot Mono
      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      # 2. Instalar o Godot Mono e os templates automaticamente (usando a versão completa correta)
      - name: Instalar Godot Mono & Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"         # Versão completa exigida pela action para Godot 4.3
          use-dotnet: true         # Ativa o suporte ao C# / Mono
          include-templates: true  # Baixa os export templates automaticamente

      - name: Criar diretórios de build
        run: |
          mkdir -p build/ios_xcode
          mkdir -p build/output

      # 3. Exportar o projeto para Xcode
      - name: Exportar Godot para Xcode
        run: |
          godot --headless --export-release "iOS" build/ios_xcode/polytoria.xcodeproj

      # 4. Compilar o projeto no Xcode sem assinatura (Ad-hoc)
      - name: Compilar com Xcode (Release Ad-hoc)
        run: |
          cd build/ios_xcode
          xcodebuild build \
            -project *.xcodeproj \
            -scheme *.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""

      # 5. Gerar o arquivo .IPA final
      - name: Gerar Arquivo IPA
        run: |
          mkdir -p Payload
          cp -r build/ios_xcode/build/Release-iphoneos/*.app Payload/
          zip -r build/output/Polytoria_Mono_TrollStore.ipa Payload
          echo "IPA Mono gerado com sucesso!"

      # 6. Enviar para download nos Artifacts
      - name: Enviar IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: Polytoria-Mono-TrollStore-IPA
          path: build/output/Polytoria_Mono_TrollStore.ipa
