name: Compilar Godot Mono IPA (TrollStore / LiveContainer)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_FULL_VERSION: "4.3.stable"

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 1. Instalar o .NET SDK necessário para compilar os scripts C# do Godot Mono
      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' # Ajuste para a versão do .NET que o seu Godot usa (ex: .NET 8 para Godot 4.3)

      # 2. Instalar o Godot Mono (com suporte a C# ativado)
      - name: Instalar Godot Mono Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true

      # 3. Baixar e instalar os Export Templates do Godot Mono (versão .mono)
      - name: Baixar e Configurar Export Templates Mono
        run: |
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_FULL_VERSION}/Godot_v${GODOT_FULL_VERSION}_mono_export_templates.tpz"
          
          echo "Baixando templates Mono de: $TEMPLATE_URL"
          curl -L $TEMPLATE_URL -o templates.tpz
          
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_FULL_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          
          unzip -q templates.tpz -d "$TEMPLATE_DIR"
          # O Godot Mono geralmente extrai para uma pasta com o sufixo _mono ou direto, vamos tratar ambos
          if [ -d "$TEMPLATE_DIR"/templates_* ]; then
            mv "$TEMPLATE_DIR"/templates_*/* "$TEMPLATE_DIR"/
            rm -rf "$TEMPLATE_DIR"/templates_*
          elif [ -d "$TEMPLATE_DIR"/templates ]; then
            mv "$TEMPLATE_DIR"/templates/* "$TEMPLATE_DIR"/
            rm -rf "$TEMPLATE_DIR"/templates
          fi
          
          rm templates.tpz
          echo "Templates Mono instalados com sucesso em: $TEMPLATE_DIR"

      - name: Criar diretórios de build
        run: |
          mkdir -p build/ios_xcode
          mkdir -p build/output

      # 4. Exportar o projeto Godot Mono para Xcode (o Godot compila as soluções C# automaticamente durante o export)
      - name: Exportar Godot para Xcode
        run: |
          godot --headless --export-release "iOS" build/ios_xcode/polytoria.xcodeproj

      # 5. Compilar o projeto no Xcode (Ad-hoc)
      - name: Compilar com Xcode (Release Ad-hoc)
        run: |
          cd build/ios_xcode
          xcodebuild build \
            -project *.xcodeproj \
            -scheme *.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""

      # 6. Gerar o arquivo .IPA final
      - name: Gerar Arquivo IPA
        run: |
          mkdir -p Payload
          cp -r build/ios_xcode/build/Release-iphoneos/*.app Payload/
          zip -r build/output/Polytoria_Mono_TrollStore.ipa Payload
          echo "IPA Mono gerado com sucesso!"

      - name: Enviar IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: Polytoria-Mono-TrollStore-IPA
          path: build/output/Polytoria_Mono_TrollStore.ipa
